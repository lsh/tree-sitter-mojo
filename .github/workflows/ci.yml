name: CI

on:
  push:
    branches: [main]
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp
  pull_request:
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test parser
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
      - name: Run tests
        uses: tree-sitter/parser-test-action@v2
        with:
          test-rust: true
          test-node: true
          test-python: true
          test-go: true
          # The action installs its own Swift toolchain, which on macOS can
          # lag the runner's Xcode SDK and fail to build SDK modules. Use
          # Xcode's bundled Swift there instead (next step).
          test-swift: ${{ runner.os != 'macOS' }}
      - name: Run Swift tests (Xcode toolchain)
        if: runner.os == 'macOS'
        run: |
          swift build --build-tests
          swift test --skip-build -q
      - name: Parse Mojo examples
        uses: tree-sitter/parse-action@v4
        with:
          files: |
            test/**/*.mojo
            test.mojo
